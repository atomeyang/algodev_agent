  kind: coding
  depends_on:
  - prepare_assets
  params: {}
- schema_version: '1.0'
  step_id: run_measure_threshold
  kind: experiment
  depends_on:
  - coding
  params:
    method: measure_threshold
- schema_version: '1.0'
  step_id: run_mobileclip2_v7_score
  kind: experiment
  depends_on:

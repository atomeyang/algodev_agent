[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algo-agent"
version = "0.4.0"
description = "Algorithm self-research and optimization Agent (conversational CLI, LangGraph-managed lifecycle)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "numpy>=1.26",
    "scikit-learn>=1.3",
    "python-docx>=1.1",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
algo-agent = "algo_agent.cli.main:app"

[tool.setuptools]
package-dir = { "" = "runtimes/agent_runtime/src", "algorithm_plugins" = "algorithm_plugins" }
packages = [
    "algo_agent",
    "algo_agent.cli",
    "algo_agent.service",
    "algo_agent.graph",
    "algo_agent.graph.nodes",
    "algo_agent.agents",
    "algo_agent.schemas",
    "algo_agent.storage",
    "algo_agent.providers",
    "algo_agent.evidence",
    "algo_agent.docs_export",
    "algo_agent.execution",
    "algo_agent.coding",
    "algorithm_plugins.common",
    "algorithm_plugins.demo_tabular",
    "algorithm_plugins.iqa",
    "algorithm_plugins.iqa.methods",
]

[tool.setuptools.package-data]
"algo_agent" = ["templates/*.docx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
